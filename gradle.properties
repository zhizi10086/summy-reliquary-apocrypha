# Gradle 运行参数
# 本机 Java 走 https 时需要读取 Windows 证书库（否则下载依赖会报 PKIX path building failed）
org.gradle.jvmargs=-Xmx3G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.daemon=false
# Forge 1.20.1 的官方工具链需要 Java 17；本机 JDK 走全局 ~/.gradle/gradle.properties 的 org.gradle.java.home。
# clone 之后请把下面这行改成你自己的 JDK 17 路径（不填则用系统默认 JDK，可能不是 17 而构建失败）
# org.gradle.java.home=C:/path/to/your/jdk-17
# ForgeGradle 每次应用插件时都会去连 maven.minecraftforge.net / libraries.minecraft.net 做证书检查，
# 本机（国内网络）实测会阻塞数分钟；关掉这项纯联网自检后构建恢复正常速度，不影响任何构建产物
systemProp.net.minecraftforge.gradle.check.certs=false

# 平台版本（与前置模组 Summy Reliquary 完全对齐）
minecraft_version=1.20.1
forge_version=47.4.10
curios_version=5.14.1+1.20.1

# 前置模组 Summy Reliquary 的版本：决定 libs/ 里那份 jar 的文件名（升级 SR 时同步改这里并换 jar）
summy_reliquary_version=1.8.5-forge

# 模组自身信息
# 注意：Forge 的 modId 不允许连字符，所以 modId 用下划线；注册表 / 数据包 / 资源命名空间用连字符
mod_id=summy_reliquary_apocrypha
mod_version=0.1.0
maven_group=com.summy.reliquary.apocrypha
archives_base_name=summy-reliquary-apocrypha
