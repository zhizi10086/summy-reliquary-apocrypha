// Summy Reliquary: Apocrypha 1.21.1 / NeoForge
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// Gate B 先恢复生产源码；devcheck 在核心迁移完成后单独恢复。
if (!project.hasProperty('devcheck')) {
    sourceSets.main.java.exclude 'com/summy/reliquary/apocrypha/devcheck/**'
}

repositories {
    def localMetadata = file('.gradle/se-local-maven')
    if (localMetadata.isDirectory()) {
        maven {
            name = 'SRMigrateLocalMaven'
            url = uri(localMetadata)
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'SRMigratePinned'
                    url = uri(localMetadata)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeVersion('com.google.guava', 'guava', '31.1-jre')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.8.1')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.22.1')
                includeVersion('com.google.code.gson', 'gson', '2.10')
                includeVersion('com.google.code.gson', 'gson', '2.10.1')
                includeVersion('com.mojang', 'logging', '1.1.1')
                includeVersion('org.checkerframework', 'checker-qual', '3.12.0')
                includeVersion('com.google.errorprone', 'error_prone_annotations', '2.11.0')
                includeVersion('com.google.j2objc', 'j2objc-annotations', '1.3')
                includeVersion('commons-io', 'commons-io', '2.11.0')
            }
        }
    }
    maven {
        name = 'NeoForgedForgeCDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

repositories.configureEach { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url?.host in ['maven.neoforged.net', 'maven.minecraftforge.net']) {
        repo.content {
            excludeGroupByRegex '.*'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            if (project.hasProperty('devcheck')) {
                systemProperty 'summy_apocrypha.devcheck', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'SraDevCheckWorld'
            }
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def reliquaryJar = file("libs/summy-reliquary-${project.summy_reliquary_version}.jar")

dependencies {
    implementation "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
    compileOnly files(reliquaryJar)
}

// SR 是独立模组，开发运行期必须作为 mod 放入 run/mods。
tasks.register('copySummyReliquaryJar', Copy) {
    from reliquaryJar
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn 'copySummyReliquaryJar'
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.mod_version
    inputs.property 'curios_version', project.curios_version
    inputs.property 'summy_reliquary_version', project.summy_reliquary_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'version': project.mod_version,
                'curios_version': project.curios_version,
                'summy_reliquary_version': project.summy_reliquary_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/reliquary/apocrypha/devcheck/**'
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'Summy',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : 'Summy'
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('CREDITS.md')
}

def resolveJarArchive = { String moduleDirectory ->
    File cursor = projectDir
    while (cursor != null && !new File(cursor, 'JAR').isDirectory()) {
        cursor = cursor.parentFile
    }
    if (cursor == null) {
        throw new GradleException('找不到工作区 JAR 归档目录')
    }
    return new File(cursor, "JAR/${project.minecraft_version}/${moduleDirectory}")
}

tasks.named('build') {
    doLast {
        def releaseDir = resolveJarArchive('summy-reliquary-apocrypha')
        releaseDir.mkdirs()
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException('找不到 NeoForge JAR 输出')
        }
        copy {
            from jarFile
            rename { "${project.archives_base_name}-${project.mod_version}.jar" }
            into releaseDir
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
