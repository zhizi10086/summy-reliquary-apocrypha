Summy Reliquary 的 NeoForge 1.21.1 扩展包，提供「新约」与「凋亡」两套十件 Curios 饰品。
· 前置：Summy Reliquary 2.0.0-neoforge（必需）+ Curios 9.5.1+1.21.1（必需）
· 获取：真实野箱首开保底基础件，随后按概率与十箱保底补齐四件
· 玩法：天使线弓箭/落箭/光羽/二段跳，以及恶魔线凋亡损伤/爆条/斩杀/恐惧/终歌
· 结算：三类固定真伤可突破第三方常规限伤，但不吃 SR / SE 正面增伤
· 创作来源：新约/凋亡设计灵感参考《明日方舟》，全部贴图由本模组美术自行绘制
'''

